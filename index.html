<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>웹툰 리더</title>
<style>
  :root{
    --ink:#2b2b2b;
    --paper:#f7f4ee;
    --card:#ffffff;
    --line:#e5e0d4;
    --sky:#dcebf5;
    --ground:#cfe3c9;
    --wall:#f0ece2;
    --floor:#d8cdb8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    background:var(--paper);
    color:var(--ink);
  }
  a{color:inherit;text-decoration:none;}
  .app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:30px;}

  /* ---------- Landing ---------- */
  .site-header{
    padding:20px 18px 14px;
    border-bottom:1px solid var(--line);
    position:sticky;top:0;background:var(--paper);z-index:10;
  }
  .site-header h1{font-size:20px;margin:0;}
  .site-header p{font-size:12.5px;color:#8a8478;margin:4px 0 0;}
  .series-grid{
    display:grid;grid-template-columns:1fr 1fr;gap:14px;
    padding:16px;
  }
  .series-card{
    background:var(--card);border-radius:14px;overflow:hidden;
    box-shadow:0 1px 3px rgba(0,0,0,.08);
    display:block;
  }
  .series-cover{
    height:110px;display:flex;align-items:center;justify-content:center;
  }
  .series-card .body{padding:10px 12px 12px;}
  .series-card .stitle{font-size:13.5px;font-weight:700;}
  .series-card .genre{font-size:11px;color:#9a9385;margin-top:3px;}
  .series-card .count{
    display:inline-block;margin-top:7px;font-size:10.5px;font-weight:700;
    padding:2px 8px;border-radius:10px;background:var(--paper);color:#8a8478;
  }

  /* ---------- Series page ---------- */
  .back-row{display:flex;align-items:center;gap:8px;padding:16px 18px 4px;}
  .back-row svg{width:18px;height:18px;flex-shrink:0;}
  .series-head{padding:6px 18px 16px;border-bottom:1px solid var(--line);}
  .series-head h2{font-size:18px;margin:2px 0 4px;}
  .series-head .genre{font-size:12.5px;color:#9a9385;}
  .ep-list{padding:6px 12px;}
  .ep-row{
    display:flex;align-items:center;gap:12px;
    padding:12px 8px;border-bottom:1px solid var(--line);
  }
  .ep-thumb{
    width:52px;height:52px;border-radius:10px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
  }
  .ep-row .info{flex:1;min-width:0;}
  .ep-row .etitle{font-size:13.5px;font-weight:600;}
  .ep-row .esub{font-size:11.5px;color:#9a9385;margin-top:2px;}
  .ep-row .chev{color:#c9c2b2;flex-shrink:0;}

  /* ---------- Reader ---------- */
  .reader-header{
    position:sticky;top:0;z-index:10;background:var(--paper);
    padding:12px 16px 10px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:10px;
  }
  .reader-header .titles{flex:1;min-width:0;}
  .reader-header .etitle{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .reader-header .sname{font-size:11.5px;color:#9a9385;}
  .reader-header svg{width:18px;height:18px;flex-shrink:0;}
  .langBtn{
    border:1.5px solid var(--ink);background:#fff;color:var(--ink);
    font-size:12px;font-weight:700;letter-spacing:.5px;
    padding:6px 13px;border-radius:20px;cursor:pointer;flex-shrink:0;
  }
  .langBtn.active{background:var(--rs-accent,#e8734a);color:#fff;border-color:var(--rs-accent,#e8734a);}
  main.reader{padding:16px 14px 0;}
  .panel{
    position:relative;border-radius:14px;overflow:hidden;margin-bottom:34px;
    background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.08);
    touch-action:pan-y;user-select:none;-webkit-user-select:none;
  }
  .panel svg{display:block;width:100%;height:auto;}
  .bg-layer{transition:filter .2s linear;}

  .bubble{
    position:absolute;display:grid;background:#fff;border:1.5px solid var(--ink);
    border-radius:16px;padding:8px 13px;font-size:13.5px;line-height:1.35;
    max-width:62%;box-shadow:2px 2px 0 rgba(0,0,0,.08);z-index:2;pointer-events:none;
  }
  .bubble > span{grid-area:1/1;transition:opacity .05s linear;}
  .bubble .en{opacity:0;}
  .bubble.tail-left::before{content:"";position:absolute;bottom:-11px;left:22px;border:11px solid transparent;border-top-color:var(--ink);}
  .bubble.tail-left::after{content:"";position:absolute;bottom:-8.3px;left:24.5px;border:9px solid transparent;border-top-color:#fff;}
  .bubble.tail-right::before{content:"";position:absolute;bottom:-11px;right:22px;border:11px solid transparent;border-top-color:var(--ink);}
  .bubble.tail-right::after{content:"";position:absolute;bottom:-8.3px;right:24.5px;border:9px solid transparent;border-top-color:#fff;}
  .bubble.tail-up::before{content:"";position:absolute;top:-11px;left:50%;margin-left:-11px;border:11px solid transparent;border-bottom-color:var(--ink);}
  .bubble.tail-up::after{content:"";position:absolute;top:-8.3px;left:50%;margin-left:-9px;border:9px solid transparent;border-bottom-color:#fff;}
  .bubble.thought{border-radius:26px;}
  .bubble.thought::before{content:"";position:absolute;width:12px;height:12px;border-radius:50%;background:#fff;border:1.5px solid var(--ink);bottom:-17px;left:22px;}
  .bubble.thought::after{content:"";position:absolute;width:6px;height:6px;border-radius:50%;background:#fff;border:1.5px solid var(--ink);bottom:-27px;left:13px;}
  .narration{
    position:absolute;display:grid;background:var(--rs-accent-soft,#fdece4);
    border-radius:6px;padding:7px 12px;font-size:12.5px;color:#7a4a34;
    max-width:78%;z-index:2;pointer-events:none;
  }
  .narration > span{grid-area:1/1;transition:opacity .05s linear;}
  .narration .en{opacity:0;}

  .hint{display:flex;align-items:center;justify-content:center;gap:6px;color:#a19b8d;font-size:12.5px;margin-top:4px;}
  .hint svg{width:14px;height:14px;}
  .ep-nav{display:flex;gap:10px;padding:20px 16px 6px;}
  .ep-nav button{
    flex:1;padding:12px;border-radius:10px;border:1.5px solid var(--line);
    background:var(--card);font-size:13px;font-weight:600;cursor:pointer;color:var(--ink);
  }
  .ep-nav button:disabled{opacity:.4;cursor:default;}
  footer.note{text-align:center;font-size:11.5px;color:#a19b8d;padding:14px 20px 0;}
</style>
</head>
<body>
<div id="app" class="app"></div>
<script>
/* ============ characters ============ */
function humanSVG(c){
  const x=c.x, flip=c.flip?-1:1, outfit=c.outfit||'#7FB3E0', hair=c.hair||'#2b2b2b', skin=c.skin||'#F5D9B8';
  const mouth = c.mouth==='open'
    ? `<circle cx="0" cy="-6" r="3" fill="none" stroke="#b5654a" stroke-width="1.4"/>`
    : c.mouth==='smile'
    ? `<path d="M -8 -6 Q 0 0 8 -6" stroke="#b5654a" stroke-width="2" fill="none" stroke-linecap="round"/>`
    : `<path d="M -5 -6 Q 0 -3 5 -6" stroke="#b5654a" stroke-width="1.6" fill="none" stroke-linecap="round"/>`;
  const blush = c.blush ? `<circle cx="-13" cy="-8" r="6" fill="#f6b8a3" opacity=".6"/><circle cx="13" cy="-8" r="6" fill="#f6b8a3" opacity=".6"/>` : '';
  return `<g transform="translate(${x},124) scale(${flip},1)">
    <rect x="-16" y="34" width="12" height="42" rx="4" fill="#3d3d3d"/>
    <rect x="6" y="34" width="12" height="42" rx="4" fill="#3d3d3d"/>
    <rect x="-22" y="0" width="46" height="42" rx="14" fill="${outfit}"/>
    <circle cx="0" cy="-16" r="19" fill="${skin}"/>
    <path d="M -19 -20 Q 0 -40 19 -20 Q 19 -8 12 -6 Q 8 -22 0 -22 Q -8 -22 -12 -6 Q -19 -8 -19 -20 Z" fill="${hair}"/>
    <circle cx="-7" cy="-14" r="1.6" fill="#2b2b2b"/>
    <circle cx="7" cy="-14" r="1.6" fill="#2b2b2b"/>
    ${blush}${mouth}
  </g>`;
}
function catSVG(c){
  const x=c.x, flip=c.flip?-1:1, fur=c.fur||'#E8A33D';
  return `<g transform="translate(${x},150) scale(${flip},1)">
    <ellipse cx="0" cy="18" rx="26" ry="16" fill="${fur}"/>
    <path d="M 22 14 Q 46 6 42 -14" stroke="${fur}" stroke-width="9" fill="none" stroke-linecap="round"/>
    <circle cx="0" cy="-6" r="18" fill="${fur}"/>
    <path d="M -16 -14 L -8 -26 L -2 -13 Z" fill="${fur}"/>
    <path d="M 16 -14 L 8 -26 L 2 -13 Z" fill="${fur}"/>
    <ellipse cx="-10" cy="-4" rx="10" ry="8" fill="#fff" opacity=".55"/>
    <circle cx="-6" cy="-7" r="1.6" fill="#2b2b2b"/>
    <circle cx="6" cy="-7" r="1.6" fill="#2b2b2b"/>
    <path d="M -4 -1 Q 0 2 4 -1" stroke="#8a5a2b" stroke-width="1.3" fill="none" stroke-linecap="round"/>
    <g stroke="#c98a30" stroke-width="1">
      <line x1="-8" y1="0" x2="-24" y2="-3"/><line x1="-8" y1="3" x2="-24" y2="5"/>
      <line x1="8" y1="0" x2="24" y2="-3"/><line x1="8" y1="3" x2="24" y2="5"/>
    </g>
  </g>`;
}
function propUmbrella(x){
  return `<g><path d="M ${x-52} 60 Q ${x-52} 30 ${x+8} 34 Q ${x+58} 38 ${x+60} 62 Z" fill="#F2C744"/>
  <line x1="${x+10}" y1="34" x2="${x+10}" y2="100" stroke="#7a5a1e" stroke-width="3"/></g>`;
}
function propGate(){
  return `<g><rect x="60" y="40" width="16" height="140" fill="#9a8b6f"/>
  <rect x="224" y="40" width="16" height="140" fill="#9a8b6f"/>
  <rect x="60" y="40" width="180" height="16" fill="#9a8b6f"/>
  <text x="150" y="34" text-anchor="middle" font-size="13" fill="#6b6250">S C H O O L</text></g>`;
}

/* ============ backgrounds ============ */
function bgLayer(panel){
  const t = panel.bg;
  let inner = '';
  if(t==='outdoor' || t==='rain'){
    inner += `<rect width="300" height="220" fill="var(--sky)"/><rect y="160" width="300" height="60" fill="var(--ground)"/>`;
    if(t==='rain'){
      inner += `<g stroke="#8fb8d6" stroke-width="2" stroke-linecap="round">
        <line x1="20" y1="10" x2="8" y2="40"/><line x1="60" y1="0" x2="48" y2="35"/>
        <line x1="110" y1="15" x2="98" y2="50"/><line x1="150" y1="0" x2="138" y2="30"/>
        <line x1="200" y1="20" x2="188" y2="55"/><line x1="250" y1="5" x2="238" y2="40"/>
        <line x1="280" y1="25" x2="268" y2="60"/></g>`;
    }
  } else if(t==='indoor'){
    inner += `<rect width="300" height="220" fill="var(--wall)"/><rect y="160" width="300" height="60" fill="var(--floor)"/>
    <rect x="210" y="30" width="70" height="60" rx="4" fill="var(--sky)" opacity=".6"/>`;
  } else if(t==='closeup'){
    inner += `<rect width="300" height="220" fill="#fdf6ec"/><circle cx="150" cy="100" r="72" fill="var(--rs-accent-soft,#fdece4)"/>`;
  } else if(t==='sunset'){
    inner += `<rect width="300" height="200" fill="#f6d9b0"/><circle cx="235" cy="60" r="40" fill="#f5b26a"/><rect y="150" width="300" height="50" fill="#8a8f6b"/>`;
  } else if(t==='stage'){
    inner += `<rect width="300" height="220" fill="#2b2b3d"/><circle cx="150" cy="120" r="95" fill="#3d3d55"/><circle cx="150" cy="120" r="60" fill="#4a4a68"/><rect y="185" width="300" height="35" fill="#1c1c2a"/>`;
  }
  if(panel.gate) inner += propGate();
  return `<g class="bg-layer">${inner}</g>`;
}

/* ============ panel render ============ */
function renderPanelSVG(panel){
  const vh = panel.bg==='sunset' ? 200 : 220;
  let entities = (panel.entities||[]).map(e => e.type==='cat' ? catSVG(e) : humanSVG(e)).join('');
  let umbrella = panel.umbrella ? propUmbrella(panel.umbrella.x) : '';
  return `<svg viewBox="0 0 300 ${vh}" xmlns="http://www.w3.org/2000/svg">${bgLayer(panel)}${entities}${umbrella}</svg>`;
}
const POS = {
  TL:'top:6%;left:5%;', TR:'top:6%;right:5%;',
  CL:'top:34%;left:5%;', CR:'top:34%;right:5%;',
  BC:'bottom:6%;left:50%;transform:translateX(-50%);',
  MID:'top:38%;left:48%;', MIDUP:'top:64%;left:50%;transform:translateX(-50%);'
};
/* ============ data helpers ============ */
function renderBubbles(panel){
  return (panel.bubbles||[]).map(b => {
    const style = POS[b.pos] || '';
    return `<div class="${b.cls}" style="${style}"><span class="kr">${b.kr}</span><span class="en">${b.en}</span></div>`;
  }).join('');
}
function H(x,outfit,hair,flip,mouth,blush){return {type:'human',x,outfit,hair,flip:!!flip,mouth:mouth||'neutral',blush:!!blush};}
function CAT(x,flip,fur){return {type:'cat',x,flip:!!flip,fur};}
function B(cls,pos,kr,en){return {cls,pos,kr,en};}
function P(bg,entities,bubbles,extra){return Object.assign({bg,entities,bubbles},extra||{});}

const JIU = (x,flip,mouth,blush)=>H(x,'#7FB3E0','#2b2b2b',flip,mouth,blush);
const HANEUL = (x,flip,mouth,blush)=>H(x,'#F6C94A','#5a3d28',flip,mouth,blush);
const OWNER = (x,flip,mouth,blush)=>H(x,'#B7A6D9','#3d2b1f',flip,mouth,blush);
const BONGGU = (x,flip)=>CAT(x,flip);
const DAIN = (x,flip,mouth,blush)=>H(x,'#F49AC2','#2b2b2b',flip,mouth,blush);
const SERA = (x,flip,mouth,blush)=>H(x,'#B48EAD','#5a3d28',flip,mouth,blush);
const RINA = (x,flip,mouth,blush)=>H(x,'#5EC8C0','#2b2b2b',flip,mouth,blush);

/* ============ series: 비 오는 날 ============ */
const RAIN_EPISODES = [
{title:'1화. 첫 만남', panels:[
  P('rain',[JIU(150,false,'neutral')],[
    B('narration','TL','등굣길, 갑자기 비가 쏟아지기 시작했다.','On the way to school, the rain suddenly poured down.'),
    B('bubble thought','MID','아... 우산을 안 챙겼는데.','Ugh... I forgot my umbrella.')
  ]),
  P('rain',[JIU(110,false,'neutral'),HANEUL(190,true,'smile')],[
    B('bubble tail-right','TR','우산 같이 쓸래?','want to share my umbrella?')
  ],{umbrella:{x:150}}),
  P('closeup',[JIU(150,false,'open',true)],[
    B('bubble tail-up','MIDUP','고, 고마워...','th-thanks...')
  ]),
  P('outdoor',[JIU(110,false,'smile'),HANEUL(190,true,'smile')],[
    B('bubble tail-left','TL','그럼 이따 봐!','see you later then!'),
    B('narration','BC','그렇게, 학기 첫 친구가 생겼다.',"That's how I made my first friend of the semester.")
  ],{gate:true})
]},
{title:'2화. 급식 전쟁', panels:[
  P('indoor',[JIU(110,false,'neutral'),HANEUL(190,true,'neutral')],[
    B('narration','TL','점심시간, 오늘의 메뉴는 돈까스!',"Lunchtime — today's menu: pork cutlet!")
  ]),
  P('indoor',[JIU(110,false,'smile'),HANEUL(190,true,'neutral')],[
    B('bubble tail-left','TL','내가 두 개 챙겨놨지!','I grabbed two extra for you!')
  ]),
  P('closeup',[HANEUL(150,false,'open')],[
    B('bubble tail-up','MIDUP','역시 내 베프!',"that's my bestie!")
  ]),
  P('indoor',[JIU(110,false,'smile'),HANEUL(190,true,'smile')],[
    B('narration','BC',"그날 이후, 우리는 '돈까스 동맹'이 되었다.","From that day, we became the 'pork cutlet alliance.'")
  ])
]},
{title:'3화. 벼락치기', panels:[
  P('indoor',[JIU(110,false,'neutral'),HANEUL(190,true,'neutral')],[
    B('narration','TL','시험 하루 전, 아무것도 안 한 우리.',"The day before the exam, we'd studied nothing.")
  ]),
  P('closeup',[JIU(150,false,'open')],[
    B('bubble tail-up','MIDUP','망했다...',"we're doomed...")
  ]),
  P('indoor',[JIU(110,false,'neutral'),HANEUL(190,true,'smile')],[
    B('bubble tail-right','TR','괜찮아, 밤새면 되지!',"it's fine, we'll pull an all-nighter!")
  ]),
  P('closeup',[JIU(150,false,'neutral')],[
    B('narration','BC','결과는... 둘 다 조는 것으로 끝났다.',"In the end, we both just fell asleep.")
  ])
]},
{title:'4화. 체육대회', panels:[
  P('outdoor',[JIU(110,false,'neutral'),HANEUL(190,true,'neutral')],[
    B('narration','TL','오늘은 반 대항 계주 시합!','Today: the class relay race!')
  ]),
  P('outdoor',[HANEUL(150,false,'smile')],[
    B('bubble tail-up','MIDUP','너만 믿는다!',"I'm counting on you!")
  ]),
  P('closeup',[JIU(150,false,'open')],[
    B('bubble tail-up','MIDUP','으아아아!!','aaaaahh!!')
  ]),
  P('outdoor',[JIU(110,false,'smile'),HANEUL(190,true,'smile')],[
    B('narration','BC','결과는 2등. 그래도 둘이라 즐거웠다.','We came in 2nd. But it was fun together.')
  ])
]},
{title:'5화. 떡볶이 내기', panels:[
  P('indoor',[JIU(110,false,'neutral'),HANEUL(190,true,'neutral')],[
    B('narration','TL','수학 시험 점수 내기를 했다.','We made a bet on our math scores.')
  ]),
  P('indoor',[JIU(110,false,'smile')],[
    B('bubble tail-left','TL','지는 사람이 떡볶이 쏘기?','loser buys tteokbokki?')
  ]),
  P('indoor',[HANEUL(190,true,'smile')],[
    B('bubble tail-right','TR','콜!','deal!')
  ]),
  P('closeup',[HANEUL(150,false,'neutral')],[
    B('narration','BC','그리고 하늘은 떡볶이를 쐈다.','And so, Haneul ended up buying the tteokbokki.')
  ])
]},
{title:'6화. 조별과제', panels:[
  P('indoor',[JIU(110,false,'neutral'),HANEUL(190,true,'neutral')],[
    B('narration','TL','조별과제 조원 발표 날.','The day group project teams were announced.')
  ]),
  P('indoor',[JIU(150,false,'open')],[
    B('bubble tail-up','MIDUP','우리 같은 조야!!',"we're in the same group!!")
  ]),
  P('indoor',[HANEUL(190,true,'smile'),JIU(110,false,'smile')],[
    B('bubble tail-right','TR','이번엔 진짜 열심히 하자.',"let's actually work hard this time.")
  ]),
  P('closeup',[JIU(150,false,'neutral')],[
    B('narration','BC','결과는... 발표 전날 카페에서 밤샘.','In the end... an all-nighter at a cafe.')
  ])
]},
{title:'7화. 비밀 편지', panels:[
  P('indoor',[JIU(150,false,'neutral')],[
    B('narration','TL','책상 서랍에서 편지 한 장을 발견했다.','I found a note in my desk drawer.')
  ]),
  P('closeup',[JIU(150,false,'open')],[
    B('bubble tail-up','MIDUP','이거... 누가 쓴 거지?','who... wrote this?')
  ]),
  P('indoor',[HANEUL(190,true,'open',true)],[
    B('bubble tail-right','TR','그, 그건 비밀이야!',"th-that's a secret!")
  ]),
  P('indoor',[JIU(110,false,'smile'),HANEUL(190,true,'neutral',true)],[
    B('narration','BC','범인은 아무래도 하늘인 것 같다.',"It seems pretty clear who the culprit was.")
  ])
]},
{title:'8화. 여름방학 계획', panels:[
  P('outdoor',[JIU(110,false,'neutral'),HANEUL(190,true,'neutral')],[
    B('narration','TL','드디어 여름방학이 시작됐다.','Summer vacation finally began.')
  ]),
  P('outdoor',[HANEUL(150,false,'smile')],[
    B('bubble tail-up','MIDUP','우리 바다 가자!',"let's go to the beach!")
  ]),
  P('outdoor',[JIU(150,false,'smile')],[
    B('bubble tail-up','MIDUP','좋아, 콜!','sounds good, deal!')
  ]),
  P('sunset',[JIU(110,false,'smile'),HANEUL(190,true,'smile')],[
    B('narration','BC','그렇게 우리의 첫 여행이 시작되었다.','And so our first trip together began.')
  ])
]},

    const s = SERIES[id];
    return `<a class="series-card" href="#/series/${id}">
      <div class="series-cover" style="background:${s.accentSoft};">${iconSVG(s.icon, s.accent)}</div>
      <div class="body">
        <div class="stitle">${s.title}</div>
        <div class="genre">${s.genre}</div>
        <span class="count">전체 ${s.episodes.length}화</span>
      </div>
    </a>`;
  }).join('');
  app.innerHTML = `
    <div class="site-header"><h1>웹툰</h1><p>매일 보고 싶은 이야기</p></div>
    <div class="series-grid">${cards}</div>
  `;
}

function renderSeriesPage(id){
  const s = SERIES[id];
  if(!s){ location.hash = '#/'; return; }
  const rows = s.episodes.map((ep,i) => `
    <a class="ep-row" href="#/read/${id}/${i}">
      <div class="ep-thumb" style="background:${s.accentSoft};">${iconSVG(s.icon, s.accent)}</div>
      <div class="info">
        <div class="etitle">${ep.title}</div>
        <div class="esub">${ep.panels.length}컷</div>
      </div>
      <span class="chev"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></span>
    </a>`).join('');
  app.innerHTML = `
    <div class="back-row"><a href="#/" style="display:flex;align-items:center;gap:8px;">${backArrow()}<span style="font-size:13px;">전체 웹툰</span></a></div>
    <div class="series-head"><h2>${s.title}</h2><div class="genre">${s.genre}</div></div>
    <div class="ep-list">${rows}</div>
  `;
}

function renderReader(id, epIdx){
  const s = SERIES[id];
  if(!s || !s.episodes[epIdx]){ location.hash = '#/series/'+id; return; }
  const ep = s.episodes[epIdx];
  const panelsHTML = ep.panels.map((p,i) => {
    const hue = (epIdx * 36) % 360;
    return `<div class="panel"><div style="filter:hue-rotate(${hue}deg);" class="bg-wrap">${renderPanelSVG(p)}</div>${renderBubbles(p)}</div>`;
  }).join('');

  app.innerHTML = `
    <div class="reader-header" style="--rs-accent:${s.accent};">
      <a href="#/series/${id}" style="display:flex;">${backArrow()}</a>
      <div class="titles">
        <div class="etitle">${ep.title}</div>
        <div class="sname">${s.title}</div>
      </div>
      <button id="btnKr" class="langBtn active" type="button">KR</button>
      ${swapIcon()}
      <button id="btnEn" class="langBtn" type="button">EN</button>
    </div>
    <main class="reader" style="--rs-accent-soft:${s.accentSoft};">
      ${panelsHTML}
    </main>
    <div class="hint">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      <span>아무 컷이나 좌우로 밀면 언어가 바뀌어요</span>
    </div>
    <div class="ep-nav">
      <button id="prevEp" ${epIdx<=0?'disabled':''}>◀ 이전화</button>
      <button id="nextEp" ${epIdx>=s.episodes.length-1?'disabled':''}>다음화 ▶</button>
    </div>
    <footer class="note">${epIdx+1} / ${s.episodes.length}화</footer>
  `;

  // fix bg-wrap so svg still fills width (filter wrapper shouldn't break layout)
  document.querySelectorAll('.bg-wrap').forEach(w=>{ w.style.display='block'; });

  const panels = Array.from(document.querySelectorAll('.panel'));
  const btnKr = document.getElementById('btnKr');
  const btnEn = document.getElementById('btnEn');
  let globalProgress = savedProgress, startX=0, startY=0, startProgress=0, dragging=false, horizontal=null, lastTapTime=0;

  function applyProgressAll(p){
    p = Math.max(0, Math.min(1, p));
    globalProgress = p;
    savedProgress = p;
    document.querySelectorAll('.kr').forEach(el => el.style.opacity = 1 - p);
    document.querySelectorAll('.en').forEach(el => el.style.opacity = p);
    btnKr.classList.toggle('active', p < 0.5);
    btnEn.classList.toggle('active', p >= 0.5);
  }
  function toggleLang(){ applyProgressAll(globalProgress >= 0.5 ? 0 : 1); }
  btnKr.addEventListener('click', toggleLang);
  btnEn.addEventListener('click', toggleLang);
  applyProgressAll(savedProgress); // sync initial view (e.g. stay on EN across episodes)

  function down(x,y){ startX=x; startY=y; horizontal=null; dragging=true; startProgress=globalProgress; }
  function move(x,y){
    if(!dragging) return;
    const dx=x-startX, dy=y-startY;
    if(horizontal===null && (Math.abs(dx)>8||Math.abs(dy)>8)) horizontal = Math.abs(dx)>Math.abs(dy);
    if(horizontal) applyProgressAll(startProgress + dx/150);
  }
  function up(){
    if(!dragging) return;
    dragging=false;
    if(horizontal){
      applyProgressAll(globalProgress>=0.5?1:0);
      lastTapTime = 0;
    } else {
      const now = Date.now();
      if(now - lastTapTime < 300){
        toggleLang();
        lastTapTime = 0;
      } else {
        lastTapTime = now;
      }
    }
  }
  panels.forEach(panel=>{
    panel.addEventListener('pointerdown', e=>down(e.clientX,e.clientY));
    panel.addEventListener('pointermove', e=>move(e.clientX,e.clientY));
    panel.addEventListener('pointerup', up);
    panel.addEventListener('pointerleave', up);
    panel.addEventListener('pointercancel', up);
  });

  const prevBtn = document.getElementById('prevEp');
  const nextBtn = document.getElementById('nextEp');
  if(prevBtn) prevBtn.addEventListener('click', ()=>{ if(epIdx>0) location.hash = `#/read/${id}/${epIdx-1}`; });
  if(nextBtn) nextBtn.addEventListener('click', ()=>{ if(epIdx<s.episodes.length-1) location.hash = `#/read/${id}/${epIdx+1}`; });
  window.scrollTo(0,0);
}

/* ============ router ============ */
function route(){
  const parts = (location.hash.slice(1)||'/').split('/').filter(Boolean);
  if(parts[0]==='series') renderSeriesPage(parts[1]);
  else if(parts[0]==='read') renderReader(parts[1], parseInt(parts[2],10)||0);
  else renderLanding();
}
window.addEventListener('hashchange', route);
route();
</script>

</body>
</html>
