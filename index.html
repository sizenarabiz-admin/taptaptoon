<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>웹툰 리더</title>
<style>
  :root{
    --ink:#2b2b2b;
    --paper:#f7f4ee;
    --card:#ffffff;
    --line:#e5e0d4;
    --sky:#dcebf5;
    --ground:#cfe3c9;
    --wall:#f0ece2;
    --floor:#d8cdb8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    background:var(--paper);
    color:var(--ink);
  }
  a{color:inherit;text-decoration:none;}
  .app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:30px;}

  /* ---------- Landing ---------- */
  .site-header{
    padding:20px 18px 14px;
    border-bottom:1px solid var(--line);
    position:sticky;top:0;background:var(--paper);z-index:10;
  }
  .site-header h1{font-size:20px;margin:0;}
  .site-header p{font-size:12.5px;color:#8a8478;margin:4px 0 0;}
  .tab-bar{display:flex;gap:6px;padding:14px 16px 0;}
  .tab-btn{
    flex:1;text-align:center;padding:9px 6px;border-radius:10px;border:none;
    background:transparent;color:#9a9385;font-size:13px;font-weight:600;cursor:pointer;
  }
  .tab-btn.active{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08);}
  .news-list{padding:14px 16px 0;}
  .news-card{
    display:block;background:var(--card);border-radius:14px;padding:14px 16px;
    margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);
  }
  .news-card .tag{font-size:10.5px;font-weight:700;color:#8a8478;background:var(--paper);padding:2px 8px;border-radius:10px;}
  .news-card .ntitle{font-size:14.5px;font-weight:700;margin-top:8px;line-height:1.4;}
  .news-card .nsum{font-size:12.5px;color:#9a9385;margin-top:5px;line-height:1.5;}
  .text-reader{padding:18px 20px 0;}
  .para{display:grid;margin-bottom:16px;font-size:15px;line-height:1.85;color:#3a352c;}
  .panel.panel-text{
    background:transparent;box-shadow:none;border-radius:0;overflow:visible;
    padding:2px 4px 20px;margin-bottom:8px;border-bottom:1px solid var(--line);
    touch-action:pan-y;
  }
  .panel.panel-text:last-of-type{border-bottom:none;}
  .para > span{grid-area:1/1;transition:opacity .1s linear;}
  .para .en{opacity:0;}
  .article-head{padding:16px 20px 4px;}
  .article-head h2{font-size:18px;line-height:1.4;margin:6px 0 0;}
  .article-head .tag{font-size:10.5px;font-weight:700;color:#8a8478;background:var(--wall);padding:2px 8px;border-radius:10px;}

  .series-grid{
    display:grid;grid-template-columns:1fr 1fr;gap:14px;
    padding:16px;
  }
  .series-card{
    background:var(--card);border-radius:14px;overflow:hidden;
    box-shadow:0 1px 3px rgba(0,0,0,.08);
    display:block;
  }
  .series-cover{
    height:110px;display:flex;align-items:center;justify-content:center;
  }
  .series-card .body{padding:10px 12px 12px;}
  .series-card .stitle{font-size:13.5px;font-weight:700;}
  .series-card .genre{font-size:11px;color:#9a9385;margin-top:3px;}
  .series-card .count{
    display:inline-block;margin-top:7px;font-size:10.5px;font-weight:700;
    padding:2px 8px;border-radius:10px;background:var(--paper);color:#8a8478;
  }

  /* ---------- Series page ---------- */
  .back-row{display:flex;align-items:center;gap:8px;padding:16px 18px 4px;}
  .back-row svg{width:18px;height:18px;flex-shrink:0;}
  .series-head{padding:6px 18px 16px;border-bottom:1px solid var(--line);}
  .series-head h2{font-size:18px;margin:2px 0 4px;}
  .series-head .genre{font-size:12.5px;color:#9a9385;}
  .ep-list{padding:6px 12px;}
  .ep-row{
    display:flex;align-items:center;gap:12px;
    padding:12px 8px;border-bottom:1px solid var(--line);
  }
  .ep-thumb{
    width:52px;height:52px;border-radius:10px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
  }
  .ep-row .info{flex:1;min-width:0;}
  .ep-row .etitle{font-size:13.5px;font-weight:600;}
  .ep-row .esub{font-size:11.5px;color:#9a9385;margin-top:2px;}
  .ep-row .chev{color:#c9c2b2;flex-shrink:0;}

  /* ---------- Reader ---------- */
  .reader-header{
    position:sticky;top:0;z-index:10;background:var(--paper);
    padding:12px 16px 10px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:10px;
  }
  .reader-header .titles{flex:1;min-width:0;}
  .reader-header .etitle{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .reader-header .sname{font-size:11.5px;color:#9a9385;}
  .reader-header svg{width:18px;height:18px;flex-shrink:0;}
  .langBtn{
    border:1.5px solid var(--ink);background:#fff;color:var(--ink);
    font-size:12px;font-weight:700;letter-spacing:.5px;
    padding:6px 13px;border-radius:20px;cursor:pointer;flex-shrink:0;
  }
  .langBtn.active{background:var(--rs-accent,#e8734a);color:#fff;border-color:var(--rs-accent,#e8734a);}
  main.reader{padding:16px 14px 0;}
  .panel{
    position:relative;border-radius:14px;overflow:hidden;margin-bottom:34px;
    background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.08);
    touch-action:pan-y;user-select:none;-webkit-user-select:none;
  }
  .art{position:relative;width:100%;min-height:230px;background:#eee;overflow:hidden;}
  .art img{display:block;width:100%;height:auto;}
  .art.missing img{display:none;}
  .missing-label{display:none;position:absolute;inset:0;align-items:center;justify-content:center;
    text-align:center;color:#9a9385;font-size:12.5px;line-height:1.6;padding:16px;background:#eee;}
  .art.missing .missing-label{display:flex;flex-direction:column;}

  .bubble{
    position:absolute;display:grid;background:#fff;border:1.5px solid var(--ink);
    border-radius:16px;padding:8px 13px;font-size:13.5px;line-height:1.35;
    max-width:62%;box-shadow:2px 2px 0 rgba(0,0,0,.08);z-index:2;pointer-events:none;
  }
  .bubble > span{grid-area:1/1;transition:opacity .05s linear;}
  .bubble .en{opacity:0;}
  .bubble.tail-left::before{content:"";position:absolute;bottom:-11px;left:22px;border:11px solid transparent;border-top-color:var(--ink);}
  .bubble.tail-left::after{content:"";position:absolute;bottom:-8.3px;left:24.5px;border:9px solid transparent;border-top-color:#fff;}
  .bubble.tail-right::before{content:"";position:absolute;bottom:-11px;right:22px;border:11px solid transparent;border-top-color:var(--ink);}
  .bubble.tail-right::after{content:"";position:absolute;bottom:-8.3px;right:24.5px;border:9px solid transparent;border-top-color:#fff;}
  .bubble.tail-up::before{content:"";position:absolute;top:-11px;left:50%;margin-left:-11px;border:11px solid transparent;border-bottom-color:var(--ink);}
  .bubble.tail-up::after{content:"";position:absolute;top:-8.3px;left:50%;margin-left:-9px;border:9px solid transparent;border-bottom-color:#fff;}
  .bubble.thought{border-radius:26px;}
  .bubble.thought::before{content:"";position:absolute;width:12px;height:12px;border-radius:50%;background:#fff;border:1.5px solid var(--ink);bottom:-17px;left:22px;}
  .bubble.thought::after{content:"";position:absolute;width:6px;height:6px;border-radius:50%;background:#fff;border:1.5px solid var(--ink);bottom:-27px;left:13px;}
  .narration{
    position:absolute;display:grid;background:var(--rs-accent-soft,#fdece4);
    border-radius:6px;padding:7px 12px;font-size:12.5px;color:#7a4a34;
    max-width:78%;z-index:2;pointer-events:none;
  }
  .narration > span{grid-area:1/1;transition:opacity .05s linear;}
  .narration .en{opacity:0;}

  .hint{display:flex;align-items:center;justify-content:center;gap:6px;color:#a19b8d;font-size:12.5px;margin-top:4px;}
  .hint svg{width:14px;height:14px;}
  .ep-nav{display:flex;gap:10px;padding:20px 16px 6px;}
  .ep-nav button{
    flex:1;padding:12px;border-radius:10px;border:1.5px solid var(--line);
    background:var(--card);font-size:13px;font-weight:600;cursor:pointer;color:var(--ink);
  }
  .ep-nav button:disabled{opacity:.4;cursor:default;}
  footer.note{text-align:center;font-size:11.5px;color:#a19b8d;padding:14px 20px 0;}
</style>
</head>
<body>
<div id="app" class="app"></div>
<script>
/* ============ panel art (real image files) ============ */
// 이미지 파일 위치 규칙: images/{category}/{id}/ep{01~}_p{1~}.jpg
function panelImgPath(category, id, epIdx, panelIdx){
  const ep = String(epIdx+1).padStart(2,'0');
  return `images/${category}/${id}/ep${ep}_p${panelIdx+1}.jpg`;
}
function renderPanelArt(category, id, title, epLabel, epIdx, panelIdx){
  const path = panelImgPath(category, id, epIdx, panelIdx);
  const label = `이미지 준비중<br>${title} · ${epLabel} · ${panelIdx+1}컷<br><span style="font-size:10px;opacity:.7;">필요 파일명: ${path}</span>`;
  return `<div class="art">
    <img src="${path}" alt="${title} ${epLabel} panel ${panelIdx+1}" loading="lazy"
      onerror="this.onerror=null;this.parentElement.classList.add('missing');">
    <div class="missing-label">${label}</div>
  </div>`;
}
const POS = {
  TL:'top:6%;left:5%;', TR:'top:6%;right:5%;',
  CL:'top:34%;left:5%;', CR:'top:34%;right:5%;',
  BC:'bottom:6%;left:50%;transform:translateX(-50%);',
  MID:'top:38%;left:48%;', MIDUP:'top:64%;left:50%;transform:translateX(-50%);'
};
/* ============ data helpers ============ */
function renderBubbles(panel){
  return (panel.bubbles||[]).map(b => {
    const style = POS[b.pos] || '';
    return `<div class="${b.cls}" style="${style}"><span class="kr">${b.kr}</span><span class="en">${b.en}</span></div>`;
  }).join('');
}
function H(x,outfit,hair,flip,mouth,blush){return {type:'human',x,outfit,hair,flip:!!flip,mouth:mouth||'neutral',blush:!!blush};}
function CAT(x,flip,fur){return {type:'cat',x,flip:!!flip,fur};}
function B(cls,pos,kr,en){return {cls,pos,kr,en};}
function P(bg,entities,bubbles,extra){return Object.assign({bg,entities,bubbles},extra||{});}
function NP(kr,en,pos){ return {bubbles:[B('narration', pos||'BC', kr, en)]}; } // 소설/뉴스용: 이미지 1장 + 내레이션 1개

const JIU = (x,flip,mouth,blush)=>H(x,'#7FB3E0','#2b2b2b',flip,mouth,blush);
const HANEUL = (x,flip,mouth,blush)=>H(x,'#F6C94A','#5a3d28',flip,mouth,blush);
const OWNER = (x,flip,mouth,blush)=>H(x,'#B7A6D9','#3d2b1f',flip,mouth,blush);
const BONGGU = (x,flip)=>CAT(x,flip);
const DAIN = (x,flip,mouth,blush)=>H(x,'#F49AC2','#2b2b2b',flip,mouth,blush);
const SERA = (x,flip,mouth,blush)=>H(x,'#B48EAD','#5a3d28',flip,mouth,blush);
const RINA = (x,flip,mouth,blush)=>H(x,'#5EC8C0','#2b2b2b',flip,mouth,blush);

/* ============ series: 고양이 집사 일기 ============ */
const CAT_EPISODES = [
{title:'1화. 봉구와의 첫 만남', panels:[

    B('narration','TL','보호소에서 조그만 고양이 한 마리를 데려왔다.','I brought home a tiny cat from the shelter.')
  ]),
  P('indoor',[OWNER(110,false,'smile'),BONGGU(200,true)],[
    B('bubble tail-left','TL','네 이름은 오늘부터 봉구야.','From today, your name is Bonggu.')

{title:'3화. 새벽 기상 미션', panels:[

  P('indoor',[OWNER(110,false,'neutral'),BONGGU(200,true)],[

{title:'5화. 캣닢 파티', panels:[

{title:'6화. 손님 앞에서 낯가림', panels:[

  ]),
  P('indoor',[OWNER(150,false,'open')],[

/* ============ series: 아이돌 연습생 다이어리 ============ */
const IDOL_EPISODES = [

  if(name==='star'){
    return `<svg viewBox="0 0 60 60" width="40" height="40"><path d="M30 8 L36 24 L53 24 L39 34 L44 51 L30 41 L16 51 L21 34 L7 24 L24 24 Z" fill="${color}"/></svg>`;
  }
  if(name==='book'){
    return `<svg viewBox="0 0 60 60" width="40" height="40"><path d="M10 12 Q10 8 16 8 L28 8 L28 48 L16 48 Q10 48 10 44 Z" fill="${color}"/><path d="M50 12 Q50 8 44 8 L32 8 L32 48 L44 48 Q50 48 50 44 Z" fill="${color}" opacity=".75"/></svg>`;
  }
  if(name==='news'){
    return `<svg viewBox="0 0 60 60" width="40" height="40"><rect x="8" y="12" width="38" height="38" rx="3" fill="${color}"/><rect x="16" y="20" width="14" height="10" fill="#fff" opacity=".8"/><rect x="16" y="34" width="22" height="3" fill="#fff" opacity=".8"/><rect x="16" y="40" width="22" height="3" fill="#fff" opacity=".8"/><rect x="34" y="20" width="4" height="10" fill="#fff" opacity=".5"/></svg>`;

}

        뉴스를 불러오지 못했어요.<br><br>
        이 파일을 더블클릭해서 로컬로 바로 열면, 브라우저 보안 정책 때문에
        <b>news 폴더의 텍스트 파일을 읽지 못할 수 있어요</b>.<br><br>
        Netlify Drop 같은 곳에 올려서 웹 주소로 열면 정상적으로 보여요.
      </div></div>`;
    } else {

          <span class="tag">${a.tag}</span>
          <div class="ntitle">${a.title}</div>
          <div class="nsum">${savedProgress>=0.5 ? a.panels[0].bubbles[0].en : a.panels[0].bubbles[0].kr}</div>
        </a>`;
      }).join('');
      body = `<div class="news-list">${cards || '<div class="news-card" style="color:#9a9385;">아직 등록된 기사가 없어요.</div>'}</div>`;

function renderPanelReader(o){
  const panelsHTML = o.panels.map((p,i) => {
    if(o.showArt === false){
      const paras = (p.bubbles||[]).map(b => `<p class="para"><span class="kr">${b.kr}</span><span class="en">${b.en}</span></p>`).join('');
      return `<div class="panel panel-text">${paras}</div>`;
    }
    return `<div class="panel">${renderPanelArt(o.category, o.id, o.seriesTitle, o.epLabel, o.epIdx, i)}${renderBubbles(p)}</div>`;
  }).join('');

  app.innerHTML = `
    <div class="reader-header" style="--rs-accent:${o.accent};">
      <a href="${o.backHref}" style="display:flex;">${backArrow()}</a>
      <div class="titles">
        <div class="etitle">${o.epTitle}</div>
        <div class="sname">${o.seriesTitle}</div>
      </div>
      <button id="btnKr" class="langBtn active" type="button">KR</button>
      ${swapIcon()}
      <button id="btnEn" class="langBtn" type="button">EN</button>
    </div>
    <main class="reader" style="--rs-accent-soft:${o.accentSoft};">
      ${panelsHTML}
    </main>
    <div class="hint">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      <span>${o.showArt === false ? '아무 곳이나 좌우로 밀면 언어가 바뀌어요' : '아무 컷이나 좌우로 밀면 언어가 바뀌어요'}</span>
    </div>
    ${o.showNav ? `<div class="ep-nav">
      <button id="prevEp" ${!o.prevHref?'disabled':''}>◀ 이전화</button>
      <button id="nextEp" ${!o.nextHref?'disabled':''}>다음화 ▶</button>
    </div>` : ''}
    <footer class="note">${o.footerText}</footer>
  `;

  const panels = Array.from(document.querySelectorAll('.panel'));
  const btnKr = document.getElementById('btnKr');
  const btnEn = document.getElementById('btnEn');
  let globalProgress = savedProgress, startX=0, startY=0, startProgress=0, dragging=false, horizontal=null, lastTapTime=0;

  function applyProgressAll(p){
    p = Math.max(0, Math.min(1, p));
    globalProgress = p;
    savedProgress = p;
    document.querySelectorAll('.kr').forEach(el => el.style.opacity = 1 - p);
    document.querySelectorAll('.en').forEach(el => el.style.opacity = p);
    btnKr.classList.toggle('active', p < 0.5);
    btnEn.classList.toggle('active', p >= 0.5);
  }
  function toggleLang(){ applyProgressAll(globalProgress >= 0.5 ? 0 : 1); }
  btnKr.addEventListener('click', toggleLang);
  btnEn.addEventListener('click', toggleLang);
  applyProgressAll(savedProgress);

  function down(x,y){ startX=x; startY=y; horizontal=null; dragging=true; startProgress=globalProgress; }
  function move(x,y){
    if(!dragging) return;
    const dx=x-startX, dy=y-startY;
    if(horizontal===null && (Math.abs(dx)>8||Math.abs(dy)>8)) horizontal = Math.abs(dx)>Math.abs(dy);
    if(horizontal) applyProgressAll(startProgress + dx/150);
  }
  function up(){
    if(!dragging) return;
    dragging=false;
    if(horizontal){
      applyProgressAll(globalProgress>=0.5?1:0);
      lastTapTime = 0;
    } else {
      const now = Date.now();
      if(now - lastTapTime < 300){
        toggleLang();
        lastTapTime = 0;
      } else {
        lastTapTime = now;
      }
    }
  }
  panels.forEach(panel=>{
    panel.addEventListener('pointerdown', e=>down(e.clientX,e.clientY));
    panel.addEventListener('pointermove', e=>move(e.clientX,e.clientY));
    panel.addEventListener('pointerup', up);
    panel.addEventListener('pointerleave', up);
    panel.addEventListener('pointercancel', up);
  });

  const prevBtn = document.getElementById('prevEp');
  const nextBtn = document.getElementById('nextEp');
  if(prevBtn) prevBtn.addEventListener('click', ()=>{ if(o.prevHref) location.hash = o.prevHref; });
  if(nextBtn) nextBtn.addEventListener('click', ()=>{ if(o.nextHref) location.hash = o.nextHref; });
  window.scrollTo(0,0);
}

function renderReader(id, epIdx){
  const s = SERIES[id];
  if(!s || !s.episodes[epIdx]){ location.hash = '#/webtoon/series/'+id; return; }
  const ep = s.episodes[epIdx];
  renderPanelReader({

    epTitle:ep.title, epLabel:`${epIdx+1}화`, panels:ep.panels, epIdx,
    backHref:`#/webtoon/series/${id}`,

    nextHref: epIdx<s.episodes.length-1 ? `#/webtoon/read/${id}/${epIdx+1}` : null,
    showNav:true,
    footerText:`${epIdx+1} / ${s.episodes.length}화`
  });
}

    epTitle:a.title, epLabel:'기사', panels:a.panels, epIdx:0,
    backHref:'#/tab/news',
    prevHref:null, nextHref:null,
    showNav:false, showArt:false,
    footerText:a.tag
  });
}

/* ============ news (news/ 폴더의 .txt 파일에서 로드) ============ */
let NEWS = {};
let newsLoadError = false;

function parseNewsText(text){
  text = text.replace(/\r\n/g, '\n');
  const titleMatch = text.match(/^제목:\s*(.+)$/m);
  const tagMatch = text.match(/^태그:\s*(.+)$/m);
  const krBlock = (text.split(/^한국어:\s*$/m)[1] || '').split(/^영어:\s*$/m)[0] || '';
  const enBlock = (text.split(/^영어:\s*$/m)[1] || '');
  const krParas = krBlock.split(/^---$/m).map(s=>s.trim()).filter(Boolean);
  const enParas = enBlock.split(/^---$/m).map(s=>s.trim()).filter(Boolean);
  const panels = krParas.map((kr,i)=> NP(kr, enParas[i] || ''));
  return {
    title: titleMatch ? titleMatch[1].trim() : '(제목 없음)',
    tag: tagMatch ? tagMatch[1].trim() : '',
    panels
  };
}

async function loadNewsFromFolder(){
  try{
    const idxRes = await fetch('news/_index.txt');
    if(!idxRes.ok) throw new Error('news/_index.txt를 찾을 수 없어요');
    const ids = (await idxRes.text()).split('\n').map(s=>s.trim()).filter(Boolean);
    const entries = {};
    for(const id of ids){
      try{
        const res = await fetch(`news/${id}.txt`);
        if(!res.ok) continue;
        entries[id] = parseNewsText(await res.text());
      }catch(e){ console.warn('기사 로드 실패:', id, e); }
    }
    NEWS = entries;
  }catch(e){
    console.warn('[뉴스 폴더 로드 실패]', e);
    newsLoadError = true;
  }
}

/* ============ router ============ */
function route(){
  const parts = (location.hash.slice(1)||'/').split('/').filter(Boolean);
  if(parts[0]==='tab') renderLanding(parts[1]);
  else if(parts[0]==='webtoon' && parts[1]==='series') renderSeriesPage(parts[2]);
  else if(parts[0]==='webtoon' && parts[1]==='read') renderReader(parts[2], parseInt(parts[3],10)||0);
  else if(parts[0]==='novel' && parts[1]==='read') renderNovelReader(parts[2], parseInt(parts[3],10)||0);
  else if(parts[0]==='novel') renderNovelChapters(parts[1]);
  else if(parts[0]==='news' && parts[1]==='read') renderNewsReader(parts[2]);
  else renderLanding('webtoon');
}
window.addEventListener('hashchange', route);
loadNewsFromFolder().finally(route);
</script>
